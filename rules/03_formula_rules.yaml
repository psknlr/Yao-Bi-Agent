# 方剂辨证规则 - 基于沈钦荣医师209例腰痹医案统计
# 数据来源：实际病案分析，总计209例
# 方剂频次：当归四逆汤类(47), 独活寄生汤类(34), 桂枝芍药知母汤类(30), 柴胡类方(30)
# 触发逻辑：all = 全部满足；any = 任一满足；at_least = 至少N个满足

- id: F001
  name: 独活寄生汤
  category: formula
  priority: 88
  # 适用：高龄、久病、骨质疏松、肝肾不足
  trigger:
    any:
      - syndrome_肝肾不足证
      - syndrome_气血不足证
    at_least:
      count: 2
      tags:
        - elderly
        - osteoporosis
        - chronic_yabi
        - lumbar_leg_pain
  core_herbs:
    - herb: 独活
      dose: 15g
    - herb: 桑寄生
      dose: 15-30g
      note: 高龄患者可用至30g
    - herb: 秦艽
      dose: 10g
    - herb: 防风
      dose: 10g
    - herb: 杜仲
      dose: 12g
    - herb: 川牛膝
      dose: 15g
    - herb: 熟地黄
      dose: 10g
    - herb: 当归
      dose: 10g
    - herb: 白芍
      dose: 15g
    - herb: 川芎
      dose: 10g
    - herb: 细辛
      dose: 3g
      note: 最大用量3g，不可超量
    - herb: 茯苓
      dose: 30g
    - herb: 白术
      dose: 30g
    - herb: 党参
      dose: 15g
    - herb: 炙甘草
      dose: 6g
  activated_modules:
    - liver_kidney_bone
    - wind_damp_channel
    - spleen_damp_core
    - qi_blood_replenish
  compatible_syndromes:
    - 肝肾不足证
    - 气血不足证
    - 气血痹阻证
  rationale: >
    独活寄生汤为肝肾不足、风寒湿痹之经典方，本院使用34例次。
    高龄患者（≥73岁）当归使用率74%、杜仲59%、熟地黄48%，
    提示补肾扶正为治疗核心。桑寄生剂量可根据病情加至30g。
  safety_level: standard
  contraindications:
    - yellow_greasy_coating
    - hot_pain

- id: F002
  name: 当归四逆汤
  category: formula
  priority: 92
  # 最常用方（47例），适用：麻木+放射痛+四末厥冷
  trigger:
    all:
      - lower_limb_numbness
    any:
      - radiating_leg_pain
      - cold_extremities
  core_herbs:
    - herb: 当归
      dose: 10g
      note: 麻木+放射痛时使用率58%
    - herb: 桂枝
      dose: 10g
      note: 麻木+放射痛时使用率51%
    - herb: 细辛
      dose: 3g
      note: 最大用量3g，不可超量
    - herb: 通草
      dose: 10g
    - herb: 白芍
      dose: 15g
    - herb: 大枣
      dose: 10g
    - herb: 炙甘草
      dose: 15g
  activated_modules:
    - guizhi_shaoyao_pain
    - warm_yang_cold
    - blood_stasis
  compatible_syndromes:
    - 气血痹阻证
    - 寒湿痹阻证
    - 肾阳不足证
  rationale: >
    当归四逆汤为本院最常用方（47例次）。统计显示麻木合并放射痛时，
    当归使用率58%、桂枝51%、细辛为核心温经散寒药。
    四末厥冷为阳气不达四末，寒凝血滞，此方温经养血通脉。
  safety_level: standard
  contraindications:
    - yellow_greasy_coating
    - hot_pain

- id: F003
  name: 桂枝芍药知母汤
  category: formula
  priority: 85
  # 使用30例，适用：寒热错杂、关节僵硬、历节风
  trigger:
    at_least:
      count: 2
      tags:
        - cold_aggravation
        - joint_swelling
        - damp_heavy
        - lower_limb_numbness
    any:
      - syndrome_气血痹阻证
      - syndrome_寒湿痹阻证
  core_herbs:
    - herb: 桂枝
      dose: 10g
    - herb: 白芍
      dose: 20g
      note: 较常规剂量偏大，缓急止痛
    - herb: 知母
      dose: 20g
      note: 清热制约附片燥性
    - herb: 麻黄
      dose: 10g
      note: 宣散外邪
    - herb: 附片
      dose: 10g
      note: 先煎30-60分钟，必须先煎
      special: 先煎
    - herb: 防风
      dose: 10g
    - herb: 白术
      dose: 30g
    - herb: 生姜
      dose: 10g
    - herb: 甘草
      dose: 6g
  activated_modules:
    - warm_yang_cold
    - spleen_damp_core
    - guizhi_shaoyao_pain
    - wind_damp_channel
  compatible_syndromes:
    - 气血痹阻证
    - 寒湿痹阻证
    - 肾阳不足证
  rationale: >
    桂枝芍药知母汤为治历节风之经典方（使用30例次），适用于寒热错杂、
    关节肿痛变形、痹证日久。知母与附片相配，温阳而不助热，
    白术30g健脾化湿为沈老用药特色。
  safety_level: caution
  safety_note: 附片必须先煎30-60分钟，含麻黄需注意心率血压
  contraindications:
    - yellow_greasy_coating

- id: F004
  name: 柴胡类方
  category: formula
  priority: 80
  # 使用30例，适用：少阳气郁、年轻+口苦+失眠
  trigger:
    any:
      - syndrome_少阳气郁证
    at_least:
      count: 2
      tags:
        - bitter_taste
        - insomnia
        - young_patient
  core_herbs:
    - herb: 北柴胡
      dose: 5-10g
      note: 年轻患者（≤40岁）使用率47%，剂量视郁热程度调整
    - herb: 黄芩
      dose: 6g
    - herb: 党参
      dose: 15g
    - herb: 姜半夏
      dose: 6g
    - herb: 炒芥子
      dose: 10g
      note: 年轻患者使用率41%，化痰散结
    - herb: 当归
      dose: 10g
    - herb: 桂枝
      dose: 10g
    - herb: 大枣
      dose: 10g
    - herb: 炙甘草
      dose: 6g
  activated_modules:
    - shaoyang_heat_phlegm
    - sleep_calm
    - stomach_protection
    - guizhi_shaoyao_pain
  compatible_syndromes:
    - 少阳气郁证
    - 温胆痰热证
  rationale: >
    柴胡类方使用30例次，年轻患者（≤40岁）中柴胡使用率47%、
    炒芥子41%，体现少阳气郁兼痰的特点。和解少阳、疏肝解郁，
    兼调气血。桂枝10g合当归10g温通血脉，防郁久化寒。
  safety_level: standard
  contraindications:
    - cold_extremities
    - kidney_yang_deficiency_severe

- id: F005
