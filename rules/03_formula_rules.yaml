      - syndrome_肾阳不足证
      - syndrome_肝肾不足证
  core_herbs:
    - herb: 熟地黄
      dose: 10-15g
      note: 高龄患者（≥73岁）使用率48%
    - herb: 蒸萸肉
      dose: 10g
    - herb: 茯苓
      dose: 30g
    - herb: 泽泻
      dose: 10g
    - herb: 牡丹皮
      dose: 10g
    - herb: 山药
      dose: 15g
    - herb: 杜仲
      dose: 12g
      note: 高龄患者使用率59%
    - herb: 续断
      dose: 15g
    - herb: 陈皮
      dose: 6g
      note: 高龄患者使用率52%，顾护脾胃
  activated_modules:
    - kidney_yang_tonify
    - liver_kidney_bone
    - stomach_protection
    - qi_blood_replenish
  compatible_syndromes:
    - 肾阳不足证
    - 肝肾不足证
    - 气血不足证
  rationale: >
    高龄患者（≥73岁）统计显示：当归74%、杜仲59%、熟地黄48%、
    陈皮52%，呈现补肾扶正为主的用药特色。六味地黄丸合杜仲、
    续断补肾填精，陈皮顾护中焦防滋腻碍胃。
  safety_level: standard

- id: F007
  name: 黄芪桂枝五物汤
  category: formula
  priority: 70
  # 适用：气虚+肢体麻木、营卫不和
  trigger:
    all:
      - lower_limb_numbness
    any:
      - syndrome_气血不足证
      - syndrome_气血痹阻证
    at_least:
      count: 1
      tags:
        - elderly
        - chronic_yabi
  core_herbs:
    - herb: 黄芪
      dose: 30g
      note: 沈老常用剂量30g，益气固表
    - herb: 桂枝
      dose: 10g
    - herb: 白芍
      dose: 15g
    - herb: 通草
      dose: 10g
    - herb: 当归
      dose: 10g
    - herb: 大枣
      dose: 10g
    - herb: 生姜
      dose: 6g
  activated_modules:
    - qi_blood_replenish
    - guizhi_shaoyao_pain
    - blood_stasis
  compatible_syndromes:
    - 气血不足证
    - 气血痹阻证
  rationale: >
    黄芪桂枝五物汤主治血痹、肢体麻木，以黄芪30g益气为君，
    桂枝温通经脉，当归养血活血。适用于气血不足兼有麻木者，
    气虚为本，血痹为标，标本兼治。
  safety_level: standard

- id: F008
  name: 健脾通络方
  category: formula
  priority: 65
  # 适用：脾虚+经络不通、湿邪内生
  trigger:
    any:
      - syndrome_脾虚不运证
    at_least:
      count: 2
      tags:
        - poor_appetite
        - teeth_marks
        - damp_heavy
        - white_greasy_coating
        - lower_limb_numbness
  core_herbs:
    - herb: 白术
      dose: 30g
      note: 沈老健脾化湿核心剂量
    - herb: 茯苓
      dose: 30g
    - herb: 党参
      dose: 15g
    - herb: 陈皮
      dose: 6g
    - herb: 独活
      dose: 15g
    - herb: 桑寄生
      dose: 30g
    - herb: 全蝎
      dose: 3g
      note: 搜风通络，需医师审核
      special: 需审核
    - herb: 甘草
      dose: 6g
  activated_modules:
    - spleen_damp_core
    - wind_damp_channel
    - insect_channel
    - stomach_protection
  compatible_syndromes:
    - 脾虚不运证
    - 气血痹阻证
  rationale: >
    脾虚不运致湿邪内生，经络痹阻。白术30g、茯苓30g健脾化湿，
    独活寄生祛风通络，全蝎3g搜剔经络顽邪。
    脾为后天之本，脾运健则湿邪化，经络自通。
  safety_level: caution
  safety_note: 全蝎为动物药，需确认无过敏史，使用需医师审核
