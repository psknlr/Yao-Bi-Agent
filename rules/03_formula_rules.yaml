        - white_greasy_coating
        - yellow_greasy_coating
        - damp_heavy
    any:
      - syndrome_温胆痰热证
  core_herbs:
    - herb: 竹茹
      dose: 10g
      note: 温胆痰热证使用率100%
    - herb: 栀子
      dose: 10g
      note: 温胆痰热证使用率100%
    - herb: 炒芥子
      dose: 10g
      note: 温胆痰热证使用率100%
    - herb: 茯苓
      dose: 30g
    - herb: 陈皮
      dose: 6g
    - herb: 姜半夏
      dose: 6g
    - herb: 甘草
      dose: 6g
    - herb: 枳实
      dose: 10g
  activated_modules:
    - sleep_calm
    - shaoyang_heat_phlegm
    - stomach_protection
    - spleen_damp_core
  compatible_syndromes:
    - 温胆痰热证
    - 少阳气郁证
  rationale: >
    温胆汤主治痰热内扰、心神不宁。统计显示竹茹、栀子、炒芥子
    在温胆痰热证中使用率均为100%，为绝对核心药物。
    口苦+失眠+苔腻为主要辨证指标，以清胆和胃、化痰安神为法。
  safety_level: standard

- id: F006
  name: 补肾类方
  category: formula
  priority: 75
  # 适用：高龄（≥73岁）、肾虚为本
  trigger:
